<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twenty one eras</title>
  <meta name="description" content="A fan site about twenty one pilots: explore each album as its own era, with cover art, track list and 30-second previews.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23111'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23333'/><circle cx='16' cy='16' r='5' fill='%23e3261c'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <h1 class="logo">twenty one <span>eras</span></h1>
    <nav aria-label="Album eras">
      <ul id="era-list" class="era-list"></ul>
    </nav>
    <p id="status" class="status" role="status"></p>
  </header>

  <main id="main" class="layout">
    <section class="album" aria-labelledby="album-title">
      <div class="vinyl-wrapper">
        <div class="vinyl">
          <img id="cover-image" alt="" width="600" height="600">
          <span class="vinyl-grooves"></span>
          <span class="vinyl-hole"></span>
        </div>

        <button id="ned" class="ned" type="button" aria-controls="bubble" aria-expanded="false"
                aria-label="Ask Ned about this album" disabled>
          <svg class="ned-drawing" viewBox="0 0 200 240" aria-hidden="true" focusable="false">
            <g stroke="#5b5450" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
              <g class="ned-horns" fill="#8b8580">
                <path d="M78 40 Q70 18 80 8 Q84 24 92 36 Z" />
                <path d="M122 40 Q130 18 120 8 Q116 24 108 36 Z" />
              </g>
              <g class="ned-ears" fill="#efe9e3">
                <path d="M60 64 L8 46 Q14 80 56 98 Z" />
                <path d="M140 64 L192 46 Q186 80 144 98 Z" />
              </g>
              <g class="ned-inner-ears" fill="#f2c4ba" stroke="none">
                <path d="M54 70 L22 57 Q28 80 52 90 Z" />
                <path d="M146 70 L178 57 Q172 80 148 90 Z" />
              </g>
              <g class="ned-blue-ear-tufts" fill="none" stroke="#4aa3df" stroke-width="1.4">
                <path d="M50 84 L16 62 M50 85 L12 68 M50 86 L9 75 M50 87 L8 82 M51 88 L9 89 M51 89 L12 95 M52 90 L17 101 M53 91 L24 105" />
                <path d="M150 84 L184 62 M150 85 L188 68 M150 86 L191 75 M150 87 L192 82 M149 88 L191 89 M149 89 L188 95 M148 90 L183 101 M147 91 L176 105" />
              </g>
              <path class="ned-body" d="M78 120 C46 142 40 198 68 214 L132 214 C160 198 154 142 122 120 Z" fill="#efe9e3" />
              <ellipse class="ned-belly" cx="100" cy="176" rx="35" ry="33" fill="#f8f4ef" stroke="none" />
              <g class="ned-feet" fill="#efe9e3">
                <path d="M62 206 C48 212 48 228 62 228 L96 228 C100 218 96 208 88 205 Z" />
                <path d="M138 206 C152 212 152 228 138 228 L104 228 C100 218 104 208 112 205 Z" />
              </g>
              <g class="ned-toes" fill="none" stroke-width="2">
                <path d="M66 228 L66 222 M75 228 L75 221 M84 228 L84 221" />
                <path d="M134 228 L134 222 M125 228 L125 221 M116 228 L116 221" />
              </g>
              <g class="ned-arms" fill="#efe9e3">
                <path d="M64 138 C48 158 42 186 48 198 C52 206 62 202 60 192 C58 178 62 162 70 150 Z" />
                <path d="M136 138 C152 158 158 186 152 198 C148 206 138 202 140 192 C142 178 138 162 130 150 Z" />
              </g>
              <path class="ned-head" d="M100 31 C146 31 160 58 158 86 C156 112 134 126 100 126 C66 126 44 112 42 86 C40 58 54 31 100 31 Z" fill="#efe9e3" />
              <g class="ned-horn-bases" fill="#f2d6cf" stroke-width="2">
                <ellipse cx="84" cy="37" rx="9" ry="3.5" />
                <ellipse cx="116" cy="37" rx="9" ry="3.5" />
              </g>
              <g class="ned-eyes" fill="#141212" stroke="none">
                <ellipse cx="77" cy="74" rx="18" ry="15" />
                <ellipse cx="123" cy="74" rx="18" ry="15" />
              </g>
              <g class="ned-eye-shine" fill="#fff" stroke="none">
                <circle cx="86" cy="68" r="4" />
                <circle cx="132" cy="68" r="4" />
              </g>
              <path class="ned-nose" d="M94 89 L106 89 L100 96 Z" fill="#e9b3aa" stroke-width="1.5" />
              <path class="ned-closed-mouth" d="M100 96 L100 101 M90 101 Q95 106 100 101 Q105 106 110 101" fill="none" stroke-width="2" />
              <g class="ned-open-mouth">
                <ellipse cx="100" cy="105" rx="7" ry="6.5" fill="#4a2e2e" stroke-width="2" />
                <ellipse cx="100" cy="108.5" rx="4" ry="2.5" fill="#e9868f" stroke="none" />
              </g>
            </g>
          </svg>
          <span class="ned-greeting" aria-hidden="true">Hello, I'm Ned!<br>Click me to learn more about this era.</span>
        </button>

        <div id="bubble" class="bubble" hidden>
          <p class="bubble-text" aria-hidden="true">
            <span id="bubble-space-holder" class="bubble-space-holder"></span>
            <span id="bubble-typed-text" class="bubble-typed-text"></span>
          </p>
          <div class="bubble-actions">
            <button id="bubble-close" class="bubble-button" type="button" aria-label="Close">✕</button>
            <button id="bubble-next" class="bubble-button bubble-next" type="button" aria-label="Next">▼</button>
          </div>
        </div>
      </div>
      <p id="ned-line-for-screen-readers" class="visually-hidden" aria-live="polite"></p>

      <div class="album-info">
        <p id="album-year" class="album-year">—</p>
        <h2 id="album-title" class="album-title">Choose an era</h2>
        <p id="album-description" class="album-description">
          Every album is a different world. Pick one to step inside.
        </p>
        <label class="volume">
          <span>Volume</span>
          <input id="volume" type="range" min="0" max="100" step="1" value="10">
          <output id="volume-value" for="volume">10%</output>
        </label>
      </div>
    </section>

    <section class="tracks" aria-labelledby="tracks-title">
      <div class="tracks-header">
        <h2 id="tracks-title" class="section-title">
          <span id="tracks-heading">Tracks</span> <small>30-second previews</small>
        </h2>
        <button id="favourites-toggle" class="view-toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">♥</span> Favourites (<span id="favourites-count">0</span>)
        </button>
      </div>
      <p id="tracks-status" class="status" role="status"></p>
      <ol id="track-list" class="track-list"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <p>Unofficial fan project for a university assignment. Album data, artwork and previews from the iTunes Search API.</p>
  </footer>

  <template id="track-row-template">
    <li class="track">
      <button type="button" class="track-button">
        <span class="track-icon" aria-hidden="true"></span>
        <span>
          <span class="track-name"></span>
          <span class="track-album"></span>
        </span>
      </button>
      <span class="track-time"></span>
      <button type="button" class="favourite-button"></button>
      <span class="track-progress"></span>
    </li>
  </template>
</body>
</html>
